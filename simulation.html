
<!DOCTYPE html>
<html>
<head>

  <title>Simulation Tools</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="topbar">

  <button
    class="menu-btn"
    onclick="goBack()"
  >
    ←
  </button>

  <h3>Simulation Tools</h3>

  <div></div>

</div>

<div class="simulation-container">

  <label>
    Sender
  </label>

  <select id="contactSelect">

  </select>

  <label>
    Incoming Message
  </label>

  <textarea
    id="incomingMessage"
    placeholder="Type incoming message..."
  ></textarea>

  <label>
    Timestamp
  </label>

  <div class="time-options">

    <label>

      <input
        type="radio"
        name="timeMode"
        value="current"
        checked
      >

      Current Time

    </label>

    <label>

      <input
        type="radio"
        name="timeMode"
        value="custom"
      >

      Custom Time

    </label>

  </div>

  <input
    type="time"
    id="customTime"
  >

  <button
    class="inject-btn"
    onclick="injectMessage()"
  >
    Inject Message
  </button>

</div>

<script src="simulation.js"></script>

</body>
</html>
