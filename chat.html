<!DOCTYPE html>
<html>
<head>

  <title>Chat</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="topbar">

  <button
    class="menu-btn"
    onclick="goBack()"
  >
    ←
  </button>

  <h3 id="chatName"></h3>

  <div></div>

</div>

<div
  class="messages"
  id="messages"
></div>

<div class="input-area">

  <input
    type="text"
    id="messageInput"
    placeholder="Type a message"
  >

  <button onclick="sendMessage()">
    ➤
  </button>

</div>

<script src="chat.js"></script>

</body>
</html>
