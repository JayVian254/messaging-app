<!DOCTYPE html>
<html>
<head>
  <title>Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">

  <button onclick="goBack()">
    ←
  </button>

  <h2 id="chatName"></h2>

</div>

<div
  id="messages"
  style="
    padding:15px;
    height:75vh;
    overflow-y:auto;
  "
></div>

<div
  style="
    display:flex;
    padding:10px;
    gap:10px;
  "
>

  <input
    id="messageInput"
    type="text"
    placeholder="Type message"
    style="
      flex:1;
      padding:10px;
    "
  >

  <button onclick="sendMessage()">
    Send
  </button>

</div>

<script src="chat.js"></script>
</body>
</html>
